name: Security rot scan (maintainer advisory; red on findings)

on:
  schedule:
    - cron: "17 11 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-dependencies:
    name: pip-audit rot advisory (red on findings)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Audit locked Python dependencies
        uses: pypa/gh-action-pip-audit@v1.1.0
        with:
          inputs: requirements.lock
          no-deps: true

  container-images:
    name: Trivy ${{ matrix.platform }} rot advisory (red on findings)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            archive: /tmp/odograph-amd64.tar
          - platform: linux/arm64
            archive: /tmp/odograph-arm64.tar
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v4
      - name: Build local image archive
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          pull: true
          build-args: |
            VERSION=security-scan
            GIT_REVISION=${{ github.sha }}
          outputs: type=docker,dest=${{ matrix.archive }}
          provenance: false
          sbom: false
      - name: Scan local image archive
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          input: ${{ matrix.archive }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
          scanners: vuln
