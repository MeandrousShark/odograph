{% macro field_pills(label, pills, extra_class='') -%}
<div class="field{% if extra_class %} {{ extra_class }}{% endif %}">
  <span class="field-label">{{ label }}</span>
  <span class="pills">
    {% for pill in pills %}<a href="{{ pill.href }}"{% if pill.active %} class="active"{% endif %}>{{ pill.text }}</a>
    {% endfor %}
  </span>
</div>
{%- endmacro %}
