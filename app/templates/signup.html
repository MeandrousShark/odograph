{% extends "base.html" %}
{% block title %}Create administrator: Odograph{% endblock %}
{% block content %}

<div class="card auth-card">
<div class="page-title auth-page-title">
  <div>
    <h2 class="page-title-heading">Create administrator account</h2>
    <p class="page-title-subtitle">This creates the sole administrator for this Odograph instance.</p>
  </div>
</div>

{% if error %}
<div class="notice notice-danger form-error-summary" role="alert">{{ error }}</div>
{% endif %}

<form method="post" action="/signup" class="auth-form">
  <input type="hidden" name="csrf_token" value="{{ csrf }}">
  <label>Email
    <input type="email" name="email" required autocomplete="username" autofocus>
  </label>
  <label>Password
    <input type="password" name="password" required autocomplete="new-password" minlength="8">
  </label>
  <label>Confirm password
    <input type="password" name="password_confirm" required autocomplete="new-password" minlength="8">
  </label>
  <label>Time zone
    <input type="text" name="display_timezone" value="{{ display_timezone }}" required placeholder="America/Los_Angeles">
  </label>
  <button type="submit" class="control control-primary auth-submit">Create administrator</button>
</form>

<p class="muted"><a href="/login">Back to sign in</a></p>
</div>

{% endblock %}
