name: Bug report
description: Something in Odograph is not working as documented
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please do not paste `.env` contents, passwords or tokens, coordinates,
        addresses, or location logs. Redact logs before posting. Thanks for
        helping keep everyone private.
  - type: checkboxes
    id: known_issues
    attributes:
      label: Known issues
      options:
        - label: I checked docs/known-issues.md and this is not listed there.
          required: true
  - type: input
    id: release_tag
    attributes:
      label: Odograph release tag
      placeholder: v1.3.1
    validations:
      required: true
  - type: dropdown
    id: container_runtime
    attributes:
      label: Docker or Podman
      options:
        - Docker
        - Podman
    validations:
      required: true
  - type: input
    id: host_os
    attributes:
      label: Host OS
      placeholder: Debian 13
    validations:
      required: true
  - type: input
    id: reverse_proxy
    attributes:
      label: Reverse proxy
      description: Which one, if any.
  - type: dropdown
    id: phone_app
    attributes:
      label: Phone app
      options:
        - OwnTracks
        - Traccar Client
        - Other / none
  - type: dropdown
    id: phone_platform
    attributes:
      label: Phone platform
      options:
        - iOS
        - Android
        - Not applicable
  - type: input
    id: tracking_mode
    attributes:
      label: Tracking mode
      description: The mode or setting the phone app was using.
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Redact coordinates, addresses, and secrets first.
      render: text
