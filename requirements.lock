# Exact runtime dependency lock for the container image, resolved inside the
# pinned python:3.13-slim base image so versions (and any wheels with
# platform-specific builds) match the actual runtime, not the host running
# `pip freeze`. requirements.txt remains the human-edited, open-ended
# source; this file is generated output and should not be hand edited.
#
# Regenerate with:
#   podman run --rm -v "$PWD/requirements.txt:/tmp/requirements.txt:ro" \
#     docker.io/library/python:3.13-slim \
#     sh -c "pip install -q --no-cache-dir -r /tmp/requirements.txt && pip freeze" \
#     > requirements.lock
