{% from "_purpose_field.html" import purpose_field %}
<article id="trip-{{ trip.id }}" class="trip-card trip-edit-card">
  <form hx-post="/trips/{{ trip.id }}/edit" hx-target="#trip-{{ trip.id }}" hx-swap="outerHTML">
    <div class="trip-edit-heading">
      <h3>Edit {{ 'manual' if trip.source == 'manual' else 'detected' }} trip</h3>
      {% if errors %}
      <div class="form-error-summary" role="alert">
        Check the highlighted {{ 'field' if errors | length == 1 else 'fields' }} and try again.
      </div>
      {% endif %}
    </div>

    {% if trip.source == 'manual' %}
    <div class="trip-edit-grid trip-edit-manual-fields">
      <label>Date
        <input type="date" name="date" value="{{ values.date }}" required
               {% if errors.date %}aria-invalid="true" aria-describedby="edit-date-{{ trip.id }}-error"{% endif %}>
        {% if errors.date %}<span class="field-error" id="edit-date-{{ trip.id }}-error">{{ errors.date }}</span>{% endif %}
      </label>
      <label>Start time
        <input type="time" name="start_time" value="{{ values.start_time }}" required
               {% if errors.start_time %}aria-invalid="true" aria-describedby="edit-start-{{ trip.id }}-error"{% endif %}>
        {% if errors.start_time %}<span class="field-error" id="edit-start-{{ trip.id }}-error">{{ errors.start_time }}</span>{% endif %}
      </label>
      <label>End time
        <input type="time" name="end_time" value="{{ values.end_time }}" required
               {% if errors.end_time %}aria-invalid="true" aria-describedby="edit-end-{{ trip.id }}-error"{% endif %}>
        {% if errors.end_time %}<span class="field-error" id="edit-end-{{ trip.id }}-error">{{ errors.end_time }}</span>{% endif %}
      </label>
      <label>Distance (mi)
        <input type="number" name="distance" value="{{ values.distance }}" step="0.1" min="0.1" required
               {% if errors.distance %}aria-invalid="true" aria-describedby="edit-distance-{{ trip.id }}-error"{% endif %}>
        {% if errors.distance %}<span class="field-error" id="edit-distance-{{ trip.id }}-error">{{ errors.distance }}</span>{% endif %}
      </label>
    </div>
    {% endif %}

    <div class="trip-edit-grid">
      <label>Category
        <select name="category" {% if errors.category %}aria-invalid="true" aria-describedby="edit-category-{{ trip.id }}-error"{% endif %}>
          {% for category in ('unclassified', 'business', 'personal') %}
          <option value="{{ category }}" {{ 'selected' if values.category == category }}>{{ category | capitalize }}</option>
          {% endfor %}
        </select>
        {% if errors.category %}<span class="field-error" id="edit-category-{{ trip.id }}-error">{{ errors.category }}</span>{% endif %}
      </label>
      <label>Vehicle
        <select name="vehicle_id" {% if errors.vehicle_id %}aria-invalid="true" aria-describedby="edit-vehicle-{{ trip.id }}-error"{% endif %}>
          <option value="">Not assigned</option>
          {% for vehicle in vehicles %}
          <option value="{{ vehicle.id }}" {{ 'selected' if values.vehicle_id == vehicle.id | string }}>{{ vehicle.name }}</option>
          {% endfor %}
          {% if trip.vehicle_id and trip.vehicle_id not in (vehicles | map(attribute='id') | list) %}
          <option value="{{ trip.vehicle_id }}" {{ 'selected' if values.vehicle_id == trip.vehicle_id | string }}>{{ trip.vehicle_name }} (inactive)</option>
          {% endif %}
        </select>
        {% if errors.vehicle_id %}<span class="field-error" id="edit-vehicle-{{ trip.id }}-error">{{ errors.vehicle_id }}</span>{% endif %}
      </label>
      <label>Purpose
        {{ purpose_field(
          recent_purposes | default([], true), values.purpose,
          input_id='edit-purpose-' ~ trip.id,
          aria_invalid=errors.purpose,
          describedby=('edit-purpose-' ~ trip.id ~ '-error') if errors.purpose else ''
        ) }}
        {% if errors.purpose %}<span class="field-error" id="edit-purpose-{{ trip.id }}-error">{{ errors.purpose }}</span>{% endif %}
      </label>
      <label class="trip-edit-notes">Notes
        <textarea name="notes" rows="3">{{ values.notes }}</textarea>
      </label>
    </div>
    <div class="trip-edit-actions">
      <button type="submit" class="control control-primary">Save</button>
      <button type="button" class="control control-secondary"
              hx-get="/trips/{{ trip.id }}/card"
              hx-target="#trip-{{ trip.id }}" hx-swap="outerHTML">Cancel</button>
    </div>
  </form>
</article>
