# Odograph local trial: a look around with synthetic data. This is not an
# install. It has no phone connection, keeps nothing and does not verify the
# image signature. Use the file attached to a GitHub release, which pins the
# release's image digest, from a new empty directory so that no .env is in scope:
#
#   mkdir odograph-try && cd odograph-try
#   curl -fsSLO https://github.com/MeandrousShark/odograph/releases/download/vX.Y.Z/compose.try.yaml
#   docker compose -p odograph-try -f compose.try.yaml up
#
# Never omit -p. Never run this file from an install directory. Never add -v or
# --remove-orphans without -p: under an installation's project name they can
# delete its containers and its data.
#
# Open http://127.0.0.1:8079 once the seed service exits. Stop with Ctrl+C, then
# `docker compose -p odograph-try -f compose.try.yaml down` removes the
# containers, network and data. The pulled images stay until you remove them.
#
# This trial has NO AUTHENTICATION. Anyone who can reach the port is an
# administrator, so never expose it beyond loopback: do not change the port
# binding below or put a proxy in front of it. On a remote host, use an SSH
# tunnel: ssh -L 8079:127.0.0.1:8079 you@host
name: odograph-try

# A COMPOSE_PROJECT_NAME in .env or the shell beats `name:` above, and only -p
# beats it. The service names differ from compose.yaml's so that a colliding
# project still cannot match, and so recreate, an installation's containers.
services:
  try-db:
    image: ghcr.io/meandrousshark/odograph-postgis@sha256:4dc09eaaabbde791dee120e3fdb5f32cfd7d6c707a08cd38c1f9c7fe16b66982
    environment:
      POSTGRES_DB: mileage
      POSTGRES_USER: mileage
      # A fixed value is safe here: this port is never published and the data
      # is synthetic and lives on tmpfs. It protects nothing and must never be
      # reused for an installation, which generates its own in .env.
      POSTGRES_PASSWORD: trial-only-not-a-secret
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      # Over TCP because the image's first-start server only listens on its
      # Unix socket, which would report healthy before `try-app` can connect.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U mileage -d mileage"]
      interval: 2s
      timeout: 5s
      retries: 30

  # A digest, never a tag: pulling a tag would write the local release tag that
  # an installation's `pull_policy: never` relies on being verified. The
  # release workflow fills this in, so a copy from the repository cannot start.
  try-app:
    image: "${ODOGRAPH_TRY_IMAGE:?download compose.try.yaml from a GitHub release, see the header}"
    depends_on:
      try-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://mileage:trial-only-not-a-secret@try-db:5432/mileage
      # Fixed for the same reason as the database password: with authentication
      # off, a session signed by this value grants nothing it does not already.
      SESSION_SECRET: trial-only-not-a-secret-session-value
      DEV_NO_AUTH: "1"
      DEMO_MODE: "1"
    ports:
      - "127.0.0.1:8079:8000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      # CMD-SHELL because podman-compose 1.3.0 turns the CMD form into a broken
      # shell line, and this service would then never report healthy.
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)\""]
      interval: 3s
      timeout: 5s
      retries: 30

  # Shares the database container's network namespace, where the database is
  # at 127.0.0.1, so the seed's refusal of non-loopback hosts stays as it is.
  # It must run after `try-app` is healthy, once the schema and account exist.
  # The wait below repeats depends_on because podman-compose can start this
  # service before `try-app` is healthy, and a seed that starts early makes
  # `try-app` fail its startup.
  try-seed:
    image: "${ODOGRAPH_TRY_IMAGE:?download compose.try.yaml from a GitHub release, see the header}"
    command:
      - sh
      - -c
      - >-
        timeout 120 sh -c 'until python3 -c "import urllib.request; urllib.request.urlopen(\"http://try-app:8000/healthz\", timeout=3)" 2>/dev/null; do sleep 1; done'
        && exec python3 scripts/dev_seed.py
        --database-url postgresql://mileage:trial-only-not-a-secret@127.0.0.1:5432/mileage
        --wipe --scenario week
    depends_on:
      try-app:
        condition: service_healthy
    environment:
      DEMO_MODE: "1"
    network_mode: service:try-db
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    restart: "no"

# The fixed network name and no pod keep `up` off anything named after the
# project. They do not protect an installation from `down`: podman-compose picks
# networks and volumes by project label, so under an installation's project name
# `down -v` can delete its network and its database volume. Only -p odograph-try
# from a new empty directory, as in the header, protects it.
networks:
  default:
    name: odograph-try

x-podman:
  in_pod: false
