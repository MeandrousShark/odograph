name: Trial smoke

# Its own workflow because the release preflight skips a pull request that
# leaves the Compose app version unchanged, and this must run on every one.
on:
  push:
    branches:
      - main
      - next
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/next') && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/next' }}

jobs:
  trial-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ODOGRAPH_TRY_IMAGE: docker.io/library/odograph-try:ci
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build the application image
        run: docker build -t "$ODOGRAPH_TRY_IMAGE" .
      - name: Run the trial with Docker Compose
        run: scripts/try_smoke.sh compose.try.yaml
      - name: Run the trial with podman-compose 1.3.0
        env:
          COMPOSE_CMD: podman-compose
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/podman-compose"
          "$RUNNER_TEMP/podman-compose/bin/pip" install --require-hashes \
            -r .github/podman-compose.lock
          export PATH="$RUNNER_TEMP/podman-compose/bin:$PATH"
          docker save "$ODOGRAPH_TRY_IMAGE" | podman load
          scripts/try_smoke.sh compose.try.yaml

  # The install asset must pin a real digest, so the locally built image goes
  # through a throwaway registry and the smoke runs the renderer's own output.
  install-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      REGISTRY_IMAGE: docker.io/library/registry:3@sha256:82f6ff4a7f982960c8aa51617fea3aabc485df6e55cce80d22deb1de36f1bc3c
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Publish the application image to a local registry
        id: registry
        run: |
          set -euo pipefail
          docker run -d --name install-registry -p 127.0.0.1::5000 "$REGISTRY_IMAGE"
          port="$(docker port install-registry 5000/tcp | head -n 1 | sed 's/.*://')"
          image="localhost:$port/odograph"
          docker build -t "$image:ci" .
          docker push "$image:ci"
          digest="$(curl -fsSI \
            -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.docker.distribution.manifest.v2+json' \
            "http://127.0.0.1:$port/v2/odograph/manifests/ci" \
            | tr -d '\r' | sed -n 's/^[Dd]ocker-[Cc]ontent-[Dd]igest: //p')"
          # Untagged, so Compose has to pull the digest from the registry.
          docker rmi "$image:ci"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "port=$port" >> "$GITHUB_OUTPUT"
      - name: Render the install compose asset
        env:
          IMAGE: ${{ steps.registry.outputs.image }}
          DIGEST: ${{ steps.registry.outputs.digest }}
        run: |
          set -euo pipefail
          python3 scripts/render_try_compose.py --mode install --image "$IMAGE" --digest "$DIGEST" \
            --source compose.yaml --output "$RUNNER_TEMP/compose.yaml"
          python3 scripts/render_try_compose.py --mode install --image "$IMAGE" --digest "$DIGEST" \
            --source compose.yaml --verify "$RUNNER_TEMP/compose.yaml"
      - name: Install with Docker Compose
        run: scripts/install_smoke.sh "$RUNNER_TEMP/compose.yaml"
      - name: Install with podman-compose 1.3.0
        env:
          COMPOSE_CMD: podman-compose
          PORT: ${{ steps.registry.outputs.port }}
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/podman-compose"
          "$RUNNER_TEMP/podman-compose/bin/pip" install --require-hashes \
            -r .github/podman-compose.lock
          export PATH="$RUNNER_TEMP/podman-compose/bin:$PATH"
          # The throwaway registry speaks plain HTTP; Docker allows that for
          # localhost by default, podman only when told.
          sudo mkdir -p /etc/containers/registries.conf.d
          printf '[[registry]]\nlocation = "localhost:%s"\ninsecure = true\n' "$PORT" \
            | sudo tee /etc/containers/registries.conf.d/install-smoke.conf
          scripts/install_smoke.sh "$RUNNER_TEMP/compose.yaml"
