{% macro add_place_form(action='/places', lat_id='', lon_id='', lat_value=none, lon_value=none, lat_lon_required=true, radius_default=150, geocode_enabled=false, submit_label='Save') -%}
<form hx-post="{{ action }}">
  <label>Name <input type="text" name="name" required></label>
  <label>Kind
    <select name="kind">
      <option value="home">Home</option>
      <option value="work">Work</option>
      <option value="other" selected>Other</option>
    </select>
  </label>
  {% if geocode_enabled %}
  <label>Address search <input type="text" name="q" autocomplete="off"
      placeholder="Start typing an address…" style="width:16rem"
      hx-get="/places/search" hx-trigger="keyup changed delay:400ms"
      hx-target="#address-results"></label>
  <div id="address-results"></div>
  {% endif %}
  <label>Lat <input type="number" step="0.000001" name="lat"
                     {% if lat_id %}id="{{ lat_id }}"{% endif %}
                     {% if lat_value is not none %}value="{{ lat_value }}"{% endif %}
                     {% if lat_lon_required %}required{% endif %} style="width:8rem"></label>
  <label>Lon <input type="number" step="0.000001" name="lon"
                     {% if lon_id %}id="{{ lon_id }}"{% endif %}
                     {% if lon_value is not none %}value="{{ lon_value }}"{% endif %}
                     {% if lat_lon_required %}required{% endif %} style="width:8rem"></label>
  <label>Radius (m) <input type="number" name="radius_m" value="{{ radius_default }}" min="1" style="width:5rem"></label>
  <button type="submit">{{ submit_label }}</button>
</form>
{%- endmacro %}
