<section class="stats-section stats-chart-section stats-multiyear-section" aria-labelledby="stats-multiyear-heading">
  <h2 id="stats-multiyear-heading">Year-over-year monthly miles</h2>
  <div class="chart-scroll">{{ multiyear.chart_svg | safe }}</div>
  <p class="chart-legend">
    {% for yr in multiyear.years %}
    <span class="year-{{ loop.index }}">{{ yr }}</span>
    {% endfor %}
  </p>
  {% if multiyear.coverage_note %}
  <p class="muted stats-coverage">{{ multiyear.coverage_note }}</p>
  {% endif %}
</section>
