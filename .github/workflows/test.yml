name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      TEST_DATABASE_URL: postgresql://mileage:testpw@127.0.0.1:5432/mileage
    services:
      postgres:
        image: ghcr.io/meandrousshark/odograph-postgis@sha256:b352024dd6f9ca2ba0f1e7125dcfdcf78b824f2cbe86edf89559e1ddf4d80241
        env:
          POSTGRES_DB: mileage
          POSTGRES_USER: mileage
          POSTGRES_PASSWORD: testpw
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U mileage -d mileage"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          check-latest: true
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Record test environment
        run: |
          python - <<'PY'
          import json
          import os
          import platform
          import shutil
          from pathlib import Path

          cpu_model = next(
              line.split(":", 1)[1].strip()
              for line in Path("/proc/cpuinfo").read_text().splitlines()
              if line.startswith("model name")
          )
          memory = next(
              line.split(":", 1)[1].strip()
              for line in Path("/proc/meminfo").read_text().splitlines()
              if line.startswith("MemTotal:")
          )
          disk = shutil.disk_usage(".")
          print(json.dumps({
              "python": platform.python_version(),
              "system": platform.system(),
              "release": platform.release(),
              "machine": platform.machine(),
              "logical_cpus": os.cpu_count(),
              "cpu_model": cpu_model,
              "memory_total": memory,
              "disk_total_bytes": disk.total,
              "disk_free_bytes": disk.free,
          }, sort_keys=True))
          PY
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.lock
      - name: Install Gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          install_dir="$RUNNER_TEMP/gitleaks-bin"
          curl -fsSL --retry 3 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o "$archive"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check -
          mkdir -p "$install_dir"
          tar -xzf "$archive" -C "$install_dir" gitleaks
          echo "$install_dir" >> "$GITHUB_PATH"
          "$install_dir/gitleaks" version
      - name: Check shell script syntax
        run: git ls-files -z -- '*.sh' | xargs -0 -n1 bash -n
      - name: Run full test suite
        run: |
          set -euo pipefail
          if timeout --signal=INT --kill-after=15s 30m \
            python -m pytest -vv --durations=25 -o faulthandler_timeout=120 \
            > "$RUNNER_TEMP/pytest-full-suite.log" 2>&1; then
            suite_status=0
          else
            suite_status=$?
          fi
          timeout --signal=TERM --kill-after=1s 5s \
            tail -c 16384 "$RUNNER_TEMP/pytest-full-suite.log" || true
          exit "$suite_status"
      - name: Retain full suite log
        if: always()
        timeout-minutes: 2
        uses: actions/upload-artifact@v4
        with:
          name: pytest-log-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.event_name }}
          path: ${{ runner.temp }}/pytest-full-suite.log
          retention-days: 7
          if-no-files-found: warn

  public-tree:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install Gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          install_dir="$RUNNER_TEMP/gitleaks-bin"
          curl -fsSL --retry 3 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o "$archive"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check -
          mkdir -p "$install_dir"
          tar -xzf "$archive" -C "$install_dir" gitleaks
          echo "$install_dir" >> "$GITHUB_PATH"
          "$install_dir/gitleaks" version
      - name: Check public tree
        run: python scripts/check_public_tree.py
