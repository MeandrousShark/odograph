name: Upgrade drill

on:
  workflow_call:
    inputs:
      revision:
        description: Exact candidate commit to check out and drill
        required: true
        type: string
      candidate-image:
        description: Exact published candidate image; omitted to build the revision
        required: false
        default: ""
        type: string
      evidence-name:
        description: Evidence artifact prefix, unique per caller; the base is appended
        required: true
        type: string
      retention-days:
        description: Evidence artifact retention
        required: false
        default: 14
        type: number
  workflow_dispatch:
  pull_request:
    paths:
      - migrations/**
      - scripts/upgrade_check.sh
      - scripts/db_image_identity.sh
      - scripts/upgrade_drill_bases.json
      - scripts/backup_database.sh
      - scripts/restore_database.sh
      - .github/workflows/upgrade-drill.yml

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: upgrade-drill-${{ inputs.evidence-name || 'upgrade-drill' }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bases:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      bases: ${{ steps.read.outputs.bases }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.revision || github.sha }}
          persist-credentials: false
      - name: Read drill bases
        id: read
        run: |
          set -euo pipefail
          bases="$(jq -ce '
            if type == "array" and length > 0 and all(.[]; type == "string")
            then . else error("expected a nonempty list of base tags") end
          ' scripts/upgrade_drill_bases.json)"
          echo "bases=$bases" >> "$GITHUB_OUTPUT"

  drill:
    needs: bases
    name: Drill from ${{ matrix.base }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        base: ${{ fromJSON(needs.bases.outputs.bases) }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.revision || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install locked upgrade drill dependencies
        run: python -m pip install -r requirements-dev.lock
      - name: Verify native amd64 runner
        run: test "$RUNNER_ARCH" = X64 && test "$(uname -m)" = x86_64
      - name: Run upgrade and rollback drill
        env:
          BASE: ${{ matrix.base }}
          CANDIDATE_IMAGE: ${{ inputs.candidate-image }}
          REVISION: ${{ inputs.revision || github.sha }}
        run: |
          set -euo pipefail
          mkdir -p evidence
          # The literal db image of a ref's compose.yaml, empty when absent.
          db_image() {
            git show "$1:compose.yaml" | python -c '
          import sys, yaml
          doc = yaml.safe_load(sys.stdin)
          db = ((doc.get("services") or {}).get("db")) if isinstance(doc, dict) else None
          image = db.get("image") if isinstance(db, dict) else None
          if isinstance(image, str) and image.strip():
              print(image.strip())
          '
          }
          base_db="$(db_image "$BASE" || true)"
          candidate_db="$(db_image "$REVISION" || true)"
          if [ -z "$base_db" ] || [ -z "$candidate_db" ]; then
            echo "error: could not read the db image from compose.yaml at $BASE and $REVISION" >&2
            exit 1
          fi
          args=(--base "$BASE" --candidate "$REVISION")
          if [ -n "$CANDIDATE_IMAGE" ]; then
            args+=(--candidate-image "$CANDIDATE_IMAGE")
          fi
          # A changed db image swaps on the existing volume only when both
          # images report the same database identity; any other change takes
          # the fresh-volume migration. The script rejects either flag for an
          # unchanged image, and a probe that fails stops the drill.
          if [ "$base_db" != "$candidate_db" ]; then
            base_identity="$(CONTAINER_RUNTIME=docker scripts/db_image_identity.sh "$base_db")"
            candidate_identity="$(CONTAINER_RUNTIME=docker scripts/db_image_identity.sh "$candidate_db")"
            if [ "$base_identity" = "$candidate_identity" ]; then
              echo "db image rebuilt ($base_db -> $candidate_db) with the same identity ($base_identity): database image swap mode"
              args+=(--database-image-swap)
            else
              echo "db image changed ($base_db -> $candidate_db), identity $base_identity -> $candidate_identity: database image migration mode"
              args+=(--database-image-migration)
            fi
          else
            echo "db image unchanged ($base_db): standard mode"
          fi
          COMPOSE_CMD="docker compose" scripts/upgrade_check.sh \
            "${args[@]}" | \
            tee "evidence/upgrade-drill-${BASE}.txt"
      - name: Upload upgrade drill evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ inputs.evidence-name || 'upgrade-drill' }}-${{ matrix.base }}
          path: evidence/
          if-no-files-found: warn
          retention-days: ${{ inputs.retention-days || 14 }}
